name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - 'docs/FOCUSDUO_CONTRACT_V1.txt'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - 'docs/FOCUSDUO_CONTRACT_V1.txt'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check Docker for required PostgreSQL integration tests
        run: docker info
      - name: Build and run unit plus PostgreSQL Testcontainers integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

# Desktop build belongs to desktop/. Its owner can add a separate workflow
# with that project's wrapper once the Kotlin build exists.
