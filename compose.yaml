name: focusduo

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: focusduo
      POSTGRES_USER: ${DB_USERNAME:-focusduo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting PostgreSQL}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - focusduo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d focusduo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  focusduo_data:
